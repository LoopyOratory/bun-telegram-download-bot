# =============================================================================
# Hermes Video Bot — Docker Compose
# =============================================================================
# Usage:
#   docker compose up -d            # Start in background
#   docker compose logs -f          # Follow logs
#   docker compose down             # Stop
# =============================================================================

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bun-video-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN:?err}
      - OWNER_ID=${OWNER_ID:?err}
      - ALLOWED_USERS=${ALLOWED_USERS:-}
      - ALLOWED_GROUPS=${ALLOWED_GROUPS:-}
      - TEMP_DIR=/tmp/bun-video-bot
      - DOWNLOAD_TIMEOUT_SECONDS=${DOWNLOAD_TIMEOUT_SECONDS:-3600}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PROXY_URL=${PROXY_URL:-}
      - PROXY_ENABLED=${PROXY_ENABLED:-true}
      - TOR_ENABLED=${TOR_ENABLED:-true}
      - TOR_PROXY_URL=${TOR_PROXY_URL:-socks5h://127.0.0.1:9050}
      - ARIA2_ENABLED=${ARIA2_ENABLED:-false}
      - SHAREBOX_URL=${SHAREBOX_URL:-}
      - SHAREBOX_PUBLIC_URL=${SHAREBOX_PUBLIC_URL:-}
      - SHAREBOX_MIN_SIZE_MB=${SHAREBOX_MIN_SIZE_MB:-49.99}
      - SHAREBOX_TOKEN=${SHAREBOX_TOKEN:-}
      - DATABASE_PATH=/app/data/bot.db
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "bun --eval \"process.exit(0)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
